# Nginx 网关配置：整合前端静态托管 + 后端 API 反向代理 + SSE 流式响应
# 对外只暴露一个 80 端口，作为整个应用唯一入口

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 访问日志：记录真实客户端 IP（经 X-Forwarded-For）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # 上传大小上限：与后端 FILE_MAX_SIZE(20MB) 对齐，留 5MB 余量，避免 nginx 默认 1MB 拦截文件上传
    client_max_body_size 25m;

    # 后端 FastAPI 上游（容器网络内服务名）
    upstream fastapi_backend {
        server fastapi:8000;
    }

    # 限流区域定义 - 必须在 http 块顶层（阶段 8 约束）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    server {
        listen 80;
        server_name _;

        # 前端静态文件（SPA：所有非文件路径回退到 index.html）
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 后端 API（含限流 + 长超时，匹配主流程 300s）
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # 媒体静态资源（转存后的长期 URL，由后端挂载提供）
        location /media/ {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE 流式响应（独立 location：禁用缓冲 + 长超时，阶段 7/8 约束）
        location /api/v1/chat/stream {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 专用配置
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
